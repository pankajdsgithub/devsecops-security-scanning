apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web
  namespace: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-web
  template:
    metadata:
      labels:
        app: sample-web
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: sample-web
  namespace: platform
spec:
  selector:
    app: sample-web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
